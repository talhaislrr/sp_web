<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotBox Yönlendirme</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        color: #cbd5e1;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.button {
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        transition: transform 0.15s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: #2563eb;
        color: #fff;
      }

      .secondary {
        background: #1f2937;
        color: #e2e8f0;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SpotBox</h1>
      <p>Cihazın algılanıyor, ilgili mağazaya yönlendiriliyorsun...</p>
      <div class="actions">
        <a
          class="button primary"
          href="https://play.google.com/store/apps/details?id=com.anonymous.spotbox&hl=tr"
          rel="noopener noreferrer"
        >
          Play Store
        </a>
        <a
          class="button secondary"
          href="https://apps.apple.com/tr/app/spotbox-drop-your-photos/id6749022005?l=tr"
          rel="noopener noreferrer"
        >
          App Store
        </a>
      </div>
    </main>

    <script>
      (function redirectByDevice() {
        const playStoreUrl =
          "https://play.google.com/store/apps/details?id=com.anonymous.spotbox&hl=tr";
        const appStoreUrl =
          "https://apps.apple.com/tr/app/spotbox-drop-your-photos/id6749022005?l=tr";

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (
          navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1
        );

        if (isAndroid) {
          window.location.replace(playStoreUrl);
          return;
        }

        if (isIOS) {
          window.location.replace(appStoreUrl);
        }
      })();
    </script>
  </body>
</html>
